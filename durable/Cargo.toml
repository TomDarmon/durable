[workspace]
members = [
  "crates/cache",
  "crates/conformance",
  "crates/substrate",
  "crates/e2e",
  "crates/journal",
  "crates/queue",
  "crates/retention",
  "crates/s3",
  "crates/testkit",
  "crates/worker",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["durable contributors"]

[workspace.dependencies]
async-trait = "0.1"
aws-config = "=1.8.14"
aws-credential-types = "=1.2.12"
aws-runtime = "=1.7.0"
aws-sdk-s3 = "=1.123.0"
aws-smithy-async = "=1.2.12"
aws-smithy-http = "=0.63.4"
aws-smithy-http-client = "=1.1.10"
aws-smithy-observability = "=0.2.5"
aws-smithy-runtime = "=1.10.1"
aws-smithy-runtime-api = "=1.11.4"
aws-smithy-types = "=1.4.4"
aws-types = "=1.3.12"
bytes = "1"
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

cache = { path = "crates/cache" }
conformance = { path = "crates/conformance" }
substrate = { path = "crates/substrate" }
e2e = { path = "crates/e2e" }
journal = { path = "crates/journal" }
queue = { path = "crates/queue" }
retention = { path = "crates/retention" }
s3 = { path = "crates/s3" }
testkit = { path = "crates/testkit" }
worker = { path = "crates/worker" }
